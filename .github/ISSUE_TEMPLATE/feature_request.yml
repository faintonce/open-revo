name: Feature 建议
description: 提议一个新功能或改进现有功能
title: "[Feature]: "
labels: [enhancement]
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: 功能概述
      description: 请清晰、简洁地描述你希望新增或改进的功能。
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 请描述这个功能要解决的问题，以及谁会从中受益。
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: 期望方案
      description: 请描述你希望它如何工作。可以附上示例、草图或参考链接。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否尝试过其他解决方式？它们有什么不足？
  - type: textarea
    id: additional-information
    attributes:
      label: 补充信息
      description: 其他可能有帮助的信息。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 Issue，确认没有重复建议。
          required: true
        - label: 我已说明这个功能要解决的实际问题。
          required: true
        - label: 我已补充了足够的信息，便于评估该建议。
          required: true