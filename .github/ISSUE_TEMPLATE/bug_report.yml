name: Bug 反馈
description: 报告一个可复现的问题，帮助我们改进项目
title: "[Bug]: "
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: 提交日志、截图或录屏前，请移除其中的敏感信息。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰、简洁地描述遇到的问题。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请按顺序列出复现问题的步骤。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期效果
      description: 请描述你原本期望发生什么。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际效果
      description: 请描述实际发生了什么，以及问题出现的频率。
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备型号
      placeholder: 例如：设备型号
  - type: input
    id: operating-system
    attributes:
      label: 操作系统及版本
      placeholder: 例如：Windows 11
  - type: input
    id: app-version
    attributes:
      label: OpenRevo 版本
  - type: textarea
    id: attachments
    attributes:
      label: 日志、截图或录屏
      description: 如有相关内容，请附在这里。提交前请移除敏感信息。
  - type: textarea
    id: additional-information
    attributes:
      label: 补充信息
      description: 其他可能有帮助的信息。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 Issue，确认没有重复反馈。
          required: true
        - label: 我已确认问题可以复现。
          required: true
        - label: 我已移除日志、截图中的敏感信息。
          required: true