name: Release & Cloud Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Hardware Vault Gatekeeper
        shell: pwsh
        run: ./scripts/check_vault_leaks.ps1

      - name: Build Standalone Executable
        run: pnpm tauri build --no-bundle

      - name: Build NSIS Installer
        run: pnpm tauri build --bundles nsis

      # ------------------------------------------------------------------------
      # [Open Source Code Signing Hook - Reserved for SignPath / Trusted Signing]
      # When approved for free open source signing, insert the signing action here:
      # - name: Sign Executable & Installer
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
      #     ...
      # ------------------------------------------------------------------------

      - name: Prepare Artifacts & Calculate Hashes
        id: prepare_artifacts
        shell: pwsh
        run: |
          $ver = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$ver-dev" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $tag -ne "v$ver") { throw "Tag and application version differ" }
          if ((Get-Content "package.json" -Raw | ConvertFrom-Json).version -ne $ver) { throw "Frontend and application version differ" }
          Write-Host "Target Version: $ver | Tag: $tag" -ForegroundColor Green

          $distDir = "dist_artifacts"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          # 1. Standalone Exe
          $srcExe = "src-tauri/target/release/open-revo.exe"
          $destExe = "$distDir/open-revo.exe"
          Copy-Item -LiteralPath $srcExe -Destination $destExe -Force

          # 2. Portable 7z Archive
          $portableName = "OpenRevo-${tag}-portable.7z"
          $dest7z = "$distDir/$portableName"
          & 7z a -t7z -mx=9 "$dest7z" "$destExe"
          if ($LASTEXITCODE -ne 0) { throw "Portable archive build failed" }

          # 3. NSIS Installer
          $nsisSourceDir = "src-tauri/target/release/bundle/nsis"
          $matchedNsis = Get-ChildItem -Path $nsisSourceDir -Filter "*.exe" | Where-Object { $_.Name.Contains($ver) } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($matchedNsis) {
              $installerName = "OpenRevo-${tag}-x64-Setup.exe"
              $destInstaller = "$distDir/$installerName"
              Copy-Item -LiteralPath $matchedNsis.FullName -Destination $destInstaller -Force
              Write-Host "Found NSIS Installer: $installerName" -ForegroundColor Cyan
          }

          if (-not $matchedNsis) { throw "Matching NSIS installer is missing" }
          $assets = @{}
          foreach ($asset in @(@("binary_only", $destExe), @("installer", $destInstaller))) {
              $item = Get-Item -LiteralPath $asset[1]
              $assets[$asset[0]] = @{
                  filename = $item.Name
                  size = $item.Length
                  sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $item.FullName).Hash.ToLowerInvariant()
                  sources = @{ github = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($item.Name)"; gitee = "" }
              }
          }
          $manifest = @{
              version = $ver; tag = $tag; display_version = $tag
              commit = $env:GITHUB_SHA
              pub_date = [DateTime]::UtcNow.ToString("o")
              build_timestamp = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
              notes = "OpenRevo $tag"; assets = $assets
          }
          $manifestPath = "$distDir/latest.json"
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM
          $verified = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($verified.version -ne $ver -or $verified.assets.binary_only.sha256.Length -ne 64 -or $verified.assets.installer.sha256.Length -ne 64) {
              throw "Generated update manifest validation failed"
          }

          # 4. Generate SHA256 Checksums
          $checksumFile = "$distDir/checksums.txt"
          Get-ChildItem -Path $distDir -Filter "*.*" | Where-Object { $_.Name -ne "checksums.txt" } | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File -FilePath $checksumFile -Append -Encoding ascii
          }

          Write-Host "=== Artifacts Prepared ===" -ForegroundColor Green
          Get-Content $checksumFile

          # Set output for subsequent steps
          echo "tag_name=$tag" >> $env:GITHUB_OUTPUT
          echo "app_version=$ver" >> $env:GITHUB_OUTPUT

      - name: Upload Build Artifacts (Workflow Storage)
        uses: actions/upload-artifact@v4
        with:
          name: open-revo-artifacts-${{ steps.prepare_artifacts.outputs.tag_name }}
          path: dist_artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release (Tag / Dispatch)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.draft == 'true'
        with:
          name: OpenRevo ${{ steps.prepare_artifacts.outputs.tag_name }}
          tag_name: ${{ steps.prepare_artifacts.outputs.tag_name }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || contains(steps.prepare_artifacts.outputs.tag_name, '-') }}
          files: dist_artifacts/*
          generate_release_notes: true
