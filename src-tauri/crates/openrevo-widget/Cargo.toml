[package]
name = "openrevo-widget"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight native declarative Slint widget runner for OpenRevo"
license = "GPL-3.0-or-later"

[lib]
name = "openrevo_widget"
path = "src/lib.rs"

[[bin]]
name = "openrevo-widget"
path = "src/main.rs"

[dependencies]
slint = { version = "1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-2",
] }
slint-interpreter = { version = "1", default-features = false, features = [
    "compat-1-2",
] }
openrevo-core = { path = "../openrevo-core" }
spin_on = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
] }

