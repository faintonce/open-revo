[package]
name = "openrevo-osd"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight native gaming OSD overlay for OpenRevo using Slint"
license = "GPL-3.0-or-later"

[lib]
name = "openrevo_osd"
path = "src/lib.rs"

[[bin]]
name = "openrevo-osd"
path = "src/main.rs"

[dependencies]
slint = { version = "1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-2",
] }
openrevo-core = { path = "../openrevo-core" }
serde_json = "1.0"
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_Graphics_Dwm",
] }

[build-dependencies]
slint-build = "1"
